# Render Blueprint for TestMate AI (free web service, Docker). See DEPLOY.md before using it.
# Secret values are NOT stored here: entries with `sync: false` are entered in Render's dashboard.
services:
  - type: web
    name: testmate-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Deploy only when you choose (Manual Deploy), not on every push.
    autoDeploy: false
    envVars:
      - key: TESTMATE_PUBLIC_MODE
        value: "1"
      - key: TESTMATE_API_PORT
        value: "10000"
      - key: TESTMATE_DB_PATH
        value: /var/data/testmate.db
      - key: TESTMATE_TRUST_PROXY_HOPS
        value: "1"
      - key: TESTMATE_ADMIN_KEY
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
